moody_ai_assistant.chat_thread_reset:
  path: '/moody-ai/assistant/thread/{moody_ai_chat_thread}/reset'
  defaults:
    _form: '\Drupal\moody_ai_assistant\Form\AIChatThreadResetForm'
    _title: 'Reset conversation'
  requirements:
    _permission: 'use moody ai assistant'
  options:
    parameters:
      moody_ai_chat_thread:
        type: entity:moody_ai_chat_thread

moody_ai_assistant.chat_thread_action:
  path: '/moody-ai/assistant/thread/{moody_ai_chat_thread}/action/{action_id}/{decision}'
  defaults:
    _controller: '\Drupal\moody_ai_assistant\Controller\AIChatThreadActionController::handle'
  requirements:
    _permission: 'use moody ai assistant'
    _csrf_token: 'TRUE'
    decision: 'approve|reject'
    action_id: '[a-f0-9]{16}'
  options:
    parameters:
      moody_ai_chat_thread:
        type: entity:moody_ai_chat_thread

moody_ai_assistant.chat_stream:
  path: '/moody-ai/assistant/stream'
  defaults:
    _controller: '\Drupal\moody_ai_assistant\Controller\AIChatStreamController::stream'
  requirements:
    _permission: 'use moody ai assistant'
  methods: [POST]

moody_ai_assistant.chat_form:
  path: '/moody-ai/assistant/form/{entity_type}/{entity_id}'
  defaults:
    _controller: '\Drupal\moody_ai_assistant\Controller\AIChatFormController::form'
  requirements:
    _permission: 'use moody ai assistant'
    entity_type: '[a-z0-9_]+'
    entity_id: '\d+'
  methods: [POST]

moody_ai_assistant.private_uploads:
  path: '/moody-ai/assistant/uploads'
  defaults:
    _form: '\Drupal\moody_ai_assistant\Form\PrivateUploadsForm'
    _title: 'My Moody AI uploads'
  requirements:
    _permission: 'use moody ai assistant'

moody_ai_assistant.private_upload_remove:
  path: '/moody-ai/assistant/uploads/{file}/remove'
  defaults:
    _controller: '\Drupal\moody_ai_assistant\Controller\PrivateUploadActionController::remove'
  requirements:
    _permission: 'use moody ai assistant'
    file: '\d+'
  methods: [POST]
