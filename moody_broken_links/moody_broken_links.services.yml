services:
  moody_broken_links.background_scan:
    class: Drupal\moody_broken_links\BackgroundScan
  moody_broken_links.scan_kickoff:
    class: Drupal\moody_broken_links\EventSubscriber\ScanKickoff
    tags:
      - { name: event_subscriber }
  moody_broken_links.bulk_removal:
    class: Drupal\moody_broken_links\BulkRemoval
  moody_broken_links.manager:
    class: Drupal\moody_broken_links\BrokenLinksManager
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
      - '@http_client'
