block.settings.moody_scroll_reveal_media_block:
  type: block_settings
  label: 'Moody Scroll Reveal Media block'
  mapping:
    headline:
      type: string
      label: 'Section headline'
    animation_style:
      type: string
      label: 'Animation style'
    slides:
      type: sequence
      label: 'Reveal slides'
      sequence:
        type: mapping
        mapping:
          media:
            type: integer
            label: 'Media ID'
          video_url:
            type: string
            label: 'Vimeo video URL'
          video_autoplay:
            type: boolean
            label: 'Autoplay video'
          eyebrow:
            type: string
            label: 'Eyebrow'
          title:
            type: string
            label: 'Title'
          title_display:
            type: string
            label: 'Text display'
          title_position_y:
            type: string
            label: 'Vertical overlay position'
          title_position_x:
            type: string
            label: 'Horizontal overlay position'
          title_position:
            type: string
            label: 'Normalized overlay position'
          text_layout:
            type: mapping
            label: 'Independent responsive overlay layout'
            mapping:
              enabled:
                type: boolean
                label: 'Use visual layout'
              mobile:
                type: moody_scroll_reveal_media.text_pair
                label: 'Mobile'
              tablet:
                type: moody_scroll_reveal_media.text_pair
                label: 'Tablet'
              desktop:
                type: moody_scroll_reveal_media.text_pair
                label: 'Desktop'
          body:
            type: text_format
            label: 'Body'
          direction:
            type: string
            label: 'Reveal direction'

moody_scroll_reveal_media.text_pair:
  type: mapping
  mapping:
    title:
      type: moody_scroll_reveal_media.text_box
      label: 'Heading'
    body:
      type: moody_scroll_reveal_media.text_box
      label: 'Subheading'

moody_scroll_reveal_media.text_box:
  type: mapping
  mapping:
    x:
      type: float
      label: 'Left percentage'
    y:
      type: float
      label: 'Top percentage'
    width:
      type: float
      label: 'Width percentage'
    size:
      type: float
      label: 'Font size'
    align:
      type: string
      label: 'Alignment'
